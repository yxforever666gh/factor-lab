[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-research-mvp"
version = "0.1.0"
description = "Minimal factor research workflow MVP"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
