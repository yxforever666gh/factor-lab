[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-research-mvp"
version = "1.1.0"
description = "Minimal factor research workflow MVP"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.13,<3",
  "scipy>=1.15,<2",
  "scikit-learn>=1.7,<2",
  "tushare>=1.4.25",
  "pyarrow>=17.0",
  "fastapi>=0.110",
  "jinja2>=3.1",
  "uvicorn>=0.27",
  "requests>=2.31"
]

[project.scripts]
factor-lab = "factor_lab.research_os.cli:main"

[project.optional-dependencies]
research-os = [
  "SQLAlchemy==2.0.52",
  "alembic==1.19.1",
  "psycopg[binary]==3.3.4",
  "akshare==1.18.88",
  "polars==1.43.2",
  "duckdb==1.5.5",
  "pyiceberg[duckdb,polars,pyarrow,s3fs,sql-postgres]==0.11.1",
  "dagster==1.13.19",
  "dagster-webserver==1.13.19",
  "dagster-postgres==0.29.19"
]
dev = [
  "pytest>=8.0",
  "httpx>=0.28,<1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factor_lab = [
  "webui_templates/*.html",
  "webui_static/*.css",
  "research_os/migrations/*.py",
  "research_os/migrations/*.mako",
  "research_os/migrations/versions/*.py"
]
