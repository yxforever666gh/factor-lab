[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-research-mvp"
version = "4.0.0"
description = "A-share walk-forward factor selection with causal return cutoffs"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=17.0",
  "scipy>=1.11"
]

[project.scripts]
factor-lab = "factor_lab.cli:main"

[project.optional-dependencies]
data = [
  "tushare>=1.4.25",
  "akshare>=1.18",
  "requests>=2.31"
]
dev = [
  "pytest>=8.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
