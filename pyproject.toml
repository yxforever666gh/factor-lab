[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-research-mvp"
version = "8.1.0"
description = "Causal point-in-time strategy research with exact cost-aware execution"
requires-python = ">=3.10"
dependencies = [
  "pandas==2.3.3",
  "numpy==1.26.4",
  "pyarrow==25.0.1",
  "scipy==1.15.2"
]

[project.scripts]
factor-lab = "factor_lab.cli:main"

[project.optional-dependencies]
data = [
  "tushare==1.4.29",
  "akshare==1.18.64",
  "requests==2.32.3"
]
dev = [
  "pytest==9.1.1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
