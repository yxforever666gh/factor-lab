name: Factor Lab CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factor-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test research mainline
        run: python -m pytest tests/unit tests/data tests/integration -q -p no:cacheprovider
      - name: Compile production sources
        run: python -m compileall -q src/factor_lab
      - name: Verify CLI imports
        run: |
          python -m factor_lab.cli --help
          python -m factor_lab.cli strategy status
