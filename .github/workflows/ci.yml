name: Factor Lab CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factor-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Configure prospective time zone
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-TimeZone -Id "China Standard Time"
          if ([TimeZoneInfo]::Local.Id -ne "China Standard Time") {
            throw "Windows CI did not enter the prospective runtime time zone"
          }
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test lightweight mainline
        run: python -m pytest tests/unit tests/data tests/integration -q -p no:cacheprovider
      - name: Compile production sources
        run: python -m compileall -q src/factor_lab
      - name: Verify CLI imports
        run: python -m factor_lab.cli --help
