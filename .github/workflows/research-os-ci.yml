name: Research OS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform-tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          check-latest: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra research-os --extra dev
      - name: Run the complete test suite
        run: uv run python -m pytest -q
      - name: Compile all Python sources
        run: uv run python -m compileall -q src scripts

  compose-integration:
    name: PostgreSQL, MinIO, Iceberg and Dagster smoke
    runs-on: ubuntu-latest
    env:
      RESEARCH_OS_POSTGRES_DB: factor_lab_ci
      RESEARCH_OS_POSTGRES_USER: factor_lab_ci
      RESEARCH_OS_MINIO_BUCKET: factor-lab-ci
      RESEARCH_OS_IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create isolated runtime roots and secret files
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="$RUNNER_TEMP/factor-lab-runtime"
          data_root="$runtime_root/data"
          artifact_root="$runtime_root/artifacts"
          infra_secret_root="$runtime_root/secrets/infra"
          settings_secret_root="$runtime_root/secrets/settings"
          mkdir -p \
            "$data_root" \
            "$artifact_root/settings" \
            "$infra_secret_root" \
            "$settings_secret_root"
          chmod 700 "$infra_secret_root" "$settings_secret_root"
          random_secret() {
            prefix="$1"
            printf '%s-%s-%s' \
              "$prefix" \
              "$(cat /proc/sys/kernel/random/uuid)" \
              "$(cat /proc/sys/kernel/random/uuid)"
          }
          printf '%s' factorlabci >"$infra_secret_root/minio_root_user"
          random_secret postgres-ci >"$infra_secret_root/postgres_password"
          random_secret webui-postgres-ci >"$infra_secret_root/webui_postgres_password"
          random_secret minio-ci >"$infra_secret_root/minio_root_password"
          random_secret tushare-ci-fixture >"$settings_secret_root/tushare_token"
          random_secret diemeng-ci-fixture >"$settings_secret_root/diemeng_api_key"
          chmod 600 "$infra_secret_root"/* "$settings_secret_root"/*
          {
            echo "RESEARCH_OS_DATA_ROOT=$data_root"
            echo "RESEARCH_OS_ARTIFACT_ROOT=$artifact_root"
            echo "RESEARCH_OS_WEBUI_SETTINGS_ROOT=$artifact_root/settings"
            echo "RESEARCH_OS_SETTINGS_SECRETS_ROOT=$settings_secret_root"
            echo "RESEARCH_OS_POSTGRES_PASSWORD_FILE=$infra_secret_root/postgres_password"
            echo "RESEARCH_OS_WEBUI_POSTGRES_PASSWORD_FILE=$infra_secret_root/webui_postgres_password"
            echo "RESEARCH_OS_MINIO_ROOT_USER_FILE=$infra_secret_root/minio_root_user"
            echo "RESEARCH_OS_MINIO_ROOT_PASSWORD_FILE=$infra_secret_root/minio_root_password"
            echo "RESEARCH_OS_TUSHARE_TOKEN_FILE=$settings_secret_root/tushare_token"
            echo "RESEARCH_OS_DIEMENG_API_KEY_FILE=$settings_secret_root/diemeng_api_key"
          } >>"$GITHUB_ENV"
      - name: Validate Compose expansion
        run: docker compose -f infra/research_os/docker-compose.yml config --quiet
      - name: Build and start the local Research OS
        run: docker compose -f infra/research_os/docker-compose.yml up -d --build
      - name: Wait for Dagster/WebUI and verify the real services
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8766/server_info >/dev/null \
              && curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose -f infra/research_os/docker-compose.yml ps --all
              docker compose -f infra/research_os/docker-compose.yml logs --no-color
              exit 1
            fi
            sleep 5
          done
          docker compose -f infra/research_os/docker-compose.yml exec -T dagster-webserver \
            /usr/local/bin/factor-lab-entrypoint \
            alembic -c /opt/factor-lab/infra/research_os/alembic.ini current
          docker compose -f infra/research_os/docker-compose.yml exec -T dagster-webserver \
            /usr/local/bin/factor-lab-entrypoint \
            alembic -c /opt/factor-lab/infra/research_os/alembic.ini check
          docker compose -f infra/research_os/docker-compose.yml exec -T dagster-webserver \
            /usr/local/bin/factor-lab-entrypoint factor-lab doctor
          set +e
          docker compose -f infra/research_os/docker-compose.yml exec -T dagster-webserver \
            /usr/local/bin/factor-lab-entrypoint \
            factor-lab doctor --production >/tmp/production-doctor.json
          doctor_status=$?
          set -e
          test "$doctor_status" -eq 2
          grep -q '"status": "blocked"' /tmp/production-doctor.json
          docker compose -f infra/research_os/docker-compose.yml exec -T dagster-webserver \
            /usr/local/bin/factor-lab-entrypoint \
            dagster job list -w /opt/dagster/workspace.yaml >/tmp/dagster-jobs.txt
          grep -q 'research_os_daily_job' /tmp/dagster-jobs.txt
          test "$(docker inspect -f '{{.State.Running}}' factor-lab-research-os-dagster-daemon-1)" = true
      - name: Prove immutable MinIO cache recovery
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/research_os/docker-compose.yml exec -T dagster-webserver \
            /usr/local/bin/factor-lab-entrypoint python - <<'PY'
          from pathlib import Path
          from factor_lab.research_os.cli import _object_store_archive
          from factor_lab.research_os.runtime import ResearchOSSettings

          settings = ResearchOSSettings.from_env()
          archive = _object_store_archive(settings)
          root = settings.lake_root / "_ci_minio_restore_drill"
          root.mkdir(parents=True, exist_ok=True)
          source = root / "payload.bin"
          payload = b"factor-lab-ci-immutable-restore"
          source.write_bytes(payload)
          archived = archive.archive_file(source, logical_path="ci/restore-drill")
          source.unlink()
          restored = archive.restore_file(archived, source)
          assert source.read_bytes() == payload
          assert restored.sha256 == archived.sha256
          assert archive.restore_file(archived, source).reused is True
          PY
      - name: Reject raw secrets in container environments
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/research_os/docker-compose.yml ps --all -q \
            | while IFS= read -r container; do
            [ -n "$container" ] || continue
            if docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$container" \
              | grep -E '(^|_)(PASSWORD|TOKEN|API_KEY|SECRET_KEY)='; then
              echo "raw credential found in container environment: $container" >&2
              exit 1
            fi
          done
      - name: Print service logs on failure
        if: failure()
        run: docker compose -f infra/research_os/docker-compose.yml logs --no-color
      - name: Remove integration volumes
        if: always()
        run: docker compose -f infra/research_os/docker-compose.yml down --volumes --remove-orphans
