name: Prospective Ledger Attestation
run-name: prospective-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Deterministic SHA-256 request id
        required: true
        type: string
      snapshot_sha256:
        description: SHA-256 of the canonical prospective snapshot
        required: true
        type: string
      snapshot_b64:
        description: Base64-encoded canonical prospective snapshot
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify immutable release ref and reconstruct subject
        id: subject
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          SNAPSHOT_SHA256: ${{ inputs.snapshot_sha256 }}
          SNAPSHOT_B64: ${{ inputs.snapshot_b64 }}
          RELEASE_TAG: "5.0"
          WORKFLOW_FILE: prospective-attest.yml
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import unicodedata

          sha = os.environ["SNAPSHOT_SHA256"]
          if re.fullmatch(r"[0-9a-f]{64}", sha) is None:
              raise SystemExit("snapshot_sha256 is not canonical")
          try:
              raw = base64.b64decode(os.environ["SNAPSHOT_B64"], validate=True)
          except ValueError as exc:
              raise SystemExit("snapshot_b64 is invalid") from exc
          if hashlib.sha256(raw).hexdigest() != sha:
              raise SystemExit("snapshot digest mismatch")

          def reject_float(token):
              raise ValueError(f"floating point is forbidden: {token}")

          def pairs(values):
              result = {}
              for raw_key, value in values:
                  key = unicodedata.normalize("NFC", raw_key)
                  if key in result:
                      raise ValueError(f"duplicate key: {key}")
                  result[key] = value
              return result

          payload = json.loads(
              raw.decode("utf-8"),
              object_pairs_hook=pairs,
              parse_float=reject_float,
              parse_constant=reject_float,
          )
          canonical = json.dumps(
              payload,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          if canonical != raw:
              raise SystemExit("snapshot is not canonical JSON")
          if payload.get("release_tag") != os.environ["RELEASE_TAG"]:
              raise SystemExit("snapshot release tag mismatch")
          if payload.get("release_commit_oid") != os.environ["GITHUB_SHA"]:
              raise SystemExit("snapshot release commit mismatch")

          request_payload = {
              "release_ref": os.environ["GITHUB_REF"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "snapshot_sha256": sha,
              "workflow": os.environ["WORKFLOW_FILE"],
          }
          expected_request = hashlib.sha256(
              json.dumps(
                  request_payload,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")
          ).hexdigest()
          if expected_request != os.environ["REQUEST_ID"]:
              raise SystemExit("request id mismatch")

          path = Path(os.environ["RUNNER_TEMP"]) / f"prospective-snapshot-{sha}.json"
          path.write_bytes(raw)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"snapshot_path={path}\n")
          PY

      - name: Attest prospective snapshot
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.subject.outputs.snapshot_path }}
          create-storage-record: false
