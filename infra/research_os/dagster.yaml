storage:
  postgres:
    postgres_url:
      env: DAGSTER_POSTGRES_URL

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    # SourceAdapter token buckets coordinate only inside one Python process.
    # Keep all provider-bearing runs globally serial until account admission
    # is backed by a distributed limiter shared by Dagster worker processes.
    max_concurrent_runs: 1
    dequeue_use_threads: true

run_launcher:
  module: dagster
  class: DefaultRunLauncher

compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /opt/dagster/home/storage/compute-logs

local_artifact_storage:
  module: dagster.core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /opt/dagster/home/storage/artifacts

run_monitoring:
  enabled: true
  # DefaultRunLauncher cannot resume an interrupted worker. Durable task-level
  # retries are driven by the PostgreSQL-backed Research OS run ledger/sensors.
  max_resume_run_attempts: 0

telemetry:
  enabled: false

retention:
  schedule:
    purge_after_days: 90
  sensor:
    purge_after_days: 90
