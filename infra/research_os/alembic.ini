[alembic]
script_location = %(here)s/../../src/factor_lab/research_os/migrations
prepend_sys_path = %(here)s/../..
# Offline SQL rendering needs a dialect URL, but credentials must always come
# from RESEARCH_OS_DATABASE_URL for an online migration.
sqlalchemy.url = postgresql+psycopg://localhost/factor_lab

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
