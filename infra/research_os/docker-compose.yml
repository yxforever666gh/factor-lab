name: factor-lab-research-os

x-postgres-environment: &postgres-environment
  POSTGRES_DB: ${RESEARCH_OS_POSTGRES_DB:-factor_lab}
  POSTGRES_USER: ${RESEARCH_OS_POSTGRES_USER:?set RESEARCH_OS_POSTGRES_USER in infra/research_os/.env}
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

x-research-os-environment: &research-os-environment
  RESEARCH_OS_POSTGRES_HOST: postgres
  RESEARCH_OS_POSTGRES_PORT_INTERNAL: "5432"
  RESEARCH_OS_POSTGRES_DB: ${RESEARCH_OS_POSTGRES_DB:-factor_lab}
  RESEARCH_OS_POSTGRES_USER: ${RESEARCH_OS_POSTGRES_USER:?set RESEARCH_OS_POSTGRES_USER}
  FACTOR_LAB_POSTGRES_PASSWORD_FILE: /run/infra-secrets/postgres_password
  RESEARCH_OS_DATABASE_URL: postgresql+psycopg://${RESEARCH_OS_POSTGRES_USER:?set RESEARCH_OS_POSTGRES_USER}@postgres:5432/${RESEARCH_OS_POSTGRES_DB:-factor_lab}
  DAGSTER_POSTGRES_URL: postgresql://${RESEARCH_OS_POSTGRES_USER:?set RESEARCH_OS_POSTGRES_USER}@postgres:5432/${RESEARCH_OS_POSTGRES_DB:-factor_lab}?options=-csearch_path%3Ddagster
  FACTOR_LAB_DATABASE_URL: postgresql+psycopg://${RESEARCH_OS_POSTGRES_USER:?set RESEARCH_OS_POSTGRES_USER}@postgres:5432/${RESEARCH_OS_POSTGRES_DB:-factor_lab}
  FACTOR_LAB_OBJECT_STORE_ENDPOINT: http://minio:9000
  FACTOR_LAB_OBJECT_STORE_BUCKET: ${RESEARCH_OS_MINIO_BUCKET:-factor-lab}
  FACTOR_LAB_OBJECT_STORE_ACCESS_KEY_FILE: /run/infra-secrets/minio_root_user
  FACTOR_LAB_OBJECT_STORE_SECRET_KEY_FILE: /run/infra-secrets/minio_root_password
  FACTOR_LAB_ICEBERG_CATALOG_URI: postgresql+psycopg2://${RESEARCH_OS_POSTGRES_USER:?set RESEARCH_OS_POSTGRES_USER}@postgres:5432/${RESEARCH_OS_POSTGRES_DB:-factor_lab}
  FACTOR_LAB_ICEBERG_WAREHOUSE: s3://${RESEARCH_OS_MINIO_BUCKET:-factor-lab}/warehouse
  FACTOR_LAB_LAKE_ROOT: /opt/factor-lab/runtime/artifacts/lake-cache
  FACTOR_LAB_SNAPSHOT_ROOT: /opt/factor-lab/runtime/artifacts/snapshot-manifests
  FACTOR_LAB_RUNTIME_DATA_ROOT: /opt/factor-lab/runtime/data
  FACTOR_LAB_RUNTIME_ARTIFACT_ROOT: /opt/factor-lab/runtime/artifacts
  FACTOR_LAB_ENV_FILE: /opt/factor-lab/runtime/artifacts/settings/webui.env
  FACTOR_LAB_SECRETS_DIR: /run/secrets
  FACTOR_LAB_SECRETS_ROOT: /run/secrets
  FACTOR_LAB_PRODUCTION_ROLE: worker
  FACTOR_LAB_ENVIRONMENT: production
  FACTOR_LAB_OCI_IMAGE_ID: ${RESEARCH_OS_OCI_IMAGE_ID:-}
  TUSHARE_TOKEN_FILE: /run/secrets/tushare_token
  DIEMENG_API_KEY_FILE: /run/secrets/diemeng_api_key
  FACTOR_LAB_ORCHESTRATION_FACTORY: ${FACTOR_LAB_ORCHESTRATION_FACTORY-factor_lab.research_os.application_services:create_services}
  FACTOR_LAB_ORCHESTRATION_CONFIG: /opt/factor-lab/configs/research_os_orchestration.production.json
  PYICEBERG_CATALOG__FACTORLAB__TYPE: sql
  PYICEBERG_CATALOG__FACTORLAB__URI: postgresql+psycopg2://${RESEARCH_OS_POSTGRES_USER:?set RESEARCH_OS_POSTGRES_USER}@postgres:5432/${RESEARCH_OS_POSTGRES_DB:-factor_lab}
  PYICEBERG_CATALOG__FACTORLAB__WAREHOUSE: s3://${RESEARCH_OS_MINIO_BUCKET:-factor-lab}/warehouse
  PYICEBERG_CATALOG__FACTORLAB__INIT_CATALOG_TABLES: "true"
  PYICEBERG_CATALOG__FACTORLAB__S3__ENDPOINT: http://minio:9000
  PYICEBERG_CATALOG__FACTORLAB__S3__REGION: us-east-1
  PYICEBERG_CATALOG__FACTORLAB__S3__FORCE_VIRTUAL_ADDRESSING: "false"
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://minio:9000
  AWS_EC2_METADATA_DISABLED: "true"
  DAGSTER_HOME: /opt/dagster/home

x-dagster-build: &dagster-build
  context: ../..
  dockerfile: infra/research_os/Dockerfile.dagster

x-research-os-secrets: &research-os-secrets
  - postgres_password
  - minio_root_user
  - minio_root_password
  - tushare_token
  - diemeng_api_key

x-research-os-infra-secrets: &research-os-infra-secrets
  - source: postgres_password
    target: /run/infra-secrets/postgres_password
  - source: minio_root_user
    target: /run/infra-secrets/minio_root_user
  - source: minio_root_password
    target: /run/infra-secrets/minio_root_password

x-research-os-runtime-volumes: &research-os-runtime-volumes
  - type: bind
    source: ${RESEARCH_OS_DATA_ROOT:?set RESEARCH_OS_DATA_ROOT to the H drive data directory}
    target: /opt/factor-lab/runtime/data
  - type: bind
    source: ${RESEARCH_OS_ARTIFACT_ROOT:?set RESEARCH_OS_ARTIFACT_ROOT to the H drive artifact directory}
    target: /opt/factor-lab/runtime/artifacts
  - type: bind
    source: ${RESEARCH_OS_SETTINGS_SECRETS_ROOT:?set RESEARCH_OS_SETTINGS_SECRETS_ROOT to the isolated H drive source/LLM secrets directory}
    target: /run/secrets
    read_only: true

services:
  credential-check:
    image: alpine:3.20.3@sha256:1e42bbe2508154c9126d48c2b8a75420c3544343bf86fd041fb7527e017a4b4a
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_USER: ${RESEARCH_OS_POSTGRES_USER:?set RESEARCH_OS_POSTGRES_USER in infra/research_os/.env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      TUSHARE_TOKEN_FILE: /run/secrets/tushare_token
      DIEMENG_API_KEY_FILE: /run/secrets/diemeng_api_key
    secrets: *research-os-secrets
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        reject_weak() {
          value="$${1}"
          label="$${2}"
          [ "$${#value}" -ge 16 ] || { echo "$${label} must contain at least 16 characters" >&2; exit 64; }
          case "$${value}" in
            *change-me*|*changeme*|*replace-me*|*password*|*factor-lab-local*)
              echo "$${label} uses a forbidden placeholder or weak value" >&2
              exit 64
              ;;
          esac
        }
        read_one() {
          [ -f "$${1}" ] && [ ! -L "$${1}" ] || exit 64
          [ "$$(awk 'END { print NR }' "$${1}")" -eq 1 ] || exit 64
          value=$$(sed -e 's/\r$$//' "$${1}")
          [ -n "$${value}" ] || exit 64
          printf '%s' "$${value}"
        }
        postgres_password=$$(read_one "$${POSTGRES_PASSWORD_FILE}")
        minio_user=$$(read_one "$${MINIO_ROOT_USER_FILE}")
        minio_password=$$(read_one "$${MINIO_ROOT_PASSWORD_FILE}")
        tushare_token=$$(read_one "$${TUSHARE_TOKEN_FILE}")
        diemeng_key=$$(read_one "$${DIEMENG_API_KEY_FILE}")
        [ -n "$${POSTGRES_USER}" ] && [ -n "$${minio_user}" ] || exit 64
        reject_weak "$${postgres_password}" RESEARCH_OS_POSTGRES_PASSWORD_FILE
        reject_weak "$${minio_password}" RESEARCH_OS_MINIO_ROOT_PASSWORD_FILE
        [ "$${postgres_password}" != "$${POSTGRES_USER}" ] || exit 64
        [ "$${minio_password}" != "$${minio_user}" ] || exit 64
        [ "$${#tushare_token}" -ge 8 ] && [ "$${#diemeng_key}" -ge 8 ] || exit 64

  postgres:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    restart: unless-stopped
    depends_on:
      credential-check:
        condition: service_completed_successfully
    environment: *postgres-environment
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${RESEARCH_OS_POSTGRES_PORT:-5433}:5432"
    volumes:
      - research-os-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    restart: unless-stopped
    depends_on:
      credential-check:
        condition: service_completed_successfully
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    ports:
      - "127.0.0.1:${RESEARCH_OS_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${RESEARCH_OS_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - research-os-minio:/data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_BUCKET: ${RESEARCH_OS_MINIO_BUCKET:-factor-lab}
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        mc alias set local http://minio:9000 \
          "$$(cat "$${MINIO_ROOT_USER_FILE}")" \
          "$$(cat "$${MINIO_ROOT_PASSWORD_FILE}")"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"

  catalog-migrate:
    build: *dagster-build
    image: factor-lab-research-os:${RESEARCH_OS_IMAGE_TAG:-local}
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    environment: *research-os-environment
    volumes: *research-os-runtime-volumes
    secrets: *research-os-infra-secrets
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - alembic
      - -c
      - /opt/factor-lab/infra/research_os/alembic.ini
      - upgrade
      - head

  dagster-code-server:
    build: *dagster-build
    image: factor-lab-research-os:${RESEARCH_OS_IMAGE_TAG:-local}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment: *research-os-environment
    secrets: *research-os-infra-secrets
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    command:
      - dagster
      - code-server
      - start
      - --host
      - 0.0.0.0
      - --port
      - "4000"
      - --module-name
      - factor_lab.research_os.dagster_defs
      - --working-directory
      - /opt/factor-lab
      - --location-name
      - factor_lab_research_os
      # This is a user-managed gRPC location.  Dagster does not send client
      # heartbeats to workspace ``grpc_server`` origins, so enabling the code
      # server's caller-heartbeat watchdog would force a shutdown/restart loop.
      # Compose owns this process lifecycle and the gRPC healthcheck below
      # supplies liveness; the sensor records the separate 24-hour soak proof.
    volumes:
      - research-os-dagster:/opt/dagster/home/storage
      - type: bind
        source: ${RESEARCH_OS_DATA_ROOT:?set RESEARCH_OS_DATA_ROOT to the H drive data directory}
        target: /opt/factor-lab/runtime/data
      - type: bind
        source: ${RESEARCH_OS_ARTIFACT_ROOT:?set RESEARCH_OS_ARTIFACT_ROOT to the H drive artifact directory}
        target: /opt/factor-lab/runtime/artifacts
      - type: bind
        source: ${RESEARCH_OS_SETTINGS_SECRETS_ROOT:?set RESEARCH_OS_SETTINGS_SECRETS_ROOT to the isolated H drive source/LLM secrets directory}
        target: /run/secrets
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from dagster._grpc.client import DagsterGrpcClient; response=DagsterGrpcClient(host='127.0.0.1', port=4000).ping('health'); assert response.get('echo') == 'health'"
      interval: 10s
      timeout: 5s
      retries: 20

  dagster-webserver:
    build: *dagster-build
    image: factor-lab-research-os:${RESEARCH_OS_IMAGE_TAG:-local}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    environment: *research-os-environment
    secrets: *research-os-infra-secrets
    depends_on:
      dagster-code-server:
        condition: service_healthy
    command:
      - dagster-webserver
      - -h
      - 0.0.0.0
      - -p
      - "3000"
      - -w
      - /opt/dagster/workspace.yaml
    ports:
      - "127.0.0.1:${RESEARCH_OS_DAGSTER_PORT:-8766}:3000"
    volumes:
      - research-os-dagster:/opt/dagster/home/storage
      - type: bind
        source: ${RESEARCH_OS_DATA_ROOT:?set RESEARCH_OS_DATA_ROOT to the H drive data directory}
        target: /opt/factor-lab/runtime/data
        read_only: true
      - type: bind
        source: ${RESEARCH_OS_ARTIFACT_ROOT:?set RESEARCH_OS_ARTIFACT_ROOT to the H drive artifact directory}
        target: /opt/factor-lab/runtime/artifacts
      - type: bind
        source: ${RESEARCH_OS_SETTINGS_SECRETS_ROOT:?set RESEARCH_OS_SETTINGS_SECRETS_ROOT to the isolated H drive source/LLM secrets directory}
        target: /run/secrets
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/server_info', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 20

  dagster-daemon:
    build: *dagster-build
    image: factor-lab-research-os:${RESEARCH_OS_IMAGE_TAG:-local}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    environment: *research-os-environment
    secrets: *research-os-infra-secrets
    depends_on:
      dagster-code-server:
        condition: service_healthy
    command:
      - dagster-daemon
      - run
      - -w
      - /opt/dagster/workspace.yaml
    volumes:
      - research-os-dagster:/opt/dagster/home/storage
      - type: bind
        source: ${RESEARCH_OS_DATA_ROOT:?set RESEARCH_OS_DATA_ROOT to the H drive data directory}
        target: /opt/factor-lab/runtime/data
        read_only: true
      - type: bind
        source: ${RESEARCH_OS_ARTIFACT_ROOT:?set RESEARCH_OS_ARTIFACT_ROOT to the H drive artifact directory}
        target: /opt/factor-lab/runtime/artifacts
      - type: bind
        source: ${RESEARCH_OS_SETTINGS_SECRETS_ROOT:?set RESEARCH_OS_SETTINGS_SECRETS_ROOT to the isolated H drive source/LLM secrets directory}
        target: /run/secrets
        read_only: true

  webui-db-bootstrap:
    build: *dagster-build
    image: factor-lab-research-os:${RESEARCH_OS_IMAGE_TAG:-local}
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      RESEARCH_OS_POSTGRES_HOST: postgres
      RESEARCH_OS_POSTGRES_PORT_INTERNAL: "5432"
      RESEARCH_OS_POSTGRES_DB: ${RESEARCH_OS_POSTGRES_DB:-factor_lab}
      RESEARCH_OS_POSTGRES_USER: ${RESEARCH_OS_POSTGRES_USER:?set RESEARCH_OS_POSTGRES_USER}
      RESEARCH_OS_WEBUI_POSTGRES_USER: ${RESEARCH_OS_WEBUI_POSTGRES_USER:-factor_lab_webui}
      FACTOR_LAB_POSTGRES_PASSWORD_FILE: /run/infra-secrets/postgres_password
      FACTOR_LAB_WEBUI_POSTGRES_PASSWORD_FILE: /run/webui-db-secret/password
    secrets:
      - source: postgres_password
        target: /run/infra-secrets/postgres_password
      - source: webui_postgres_password
        target: /run/webui-db-secret/password
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    command:
      - python
      - -m
      - factor_lab.research_os.webui_readonly_role

  research-os-webui:
    build: *dagster-build
    image: factor-lab-research-os:${RESEARCH_OS_IMAGE_TAG:-local}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      RESEARCH_OS_POSTGRES_HOST: postgres
      RESEARCH_OS_POSTGRES_PORT_INTERNAL: "5432"
      RESEARCH_OS_POSTGRES_DB: ${RESEARCH_OS_POSTGRES_DB:-factor_lab}
      RESEARCH_OS_POSTGRES_USER: ${RESEARCH_OS_WEBUI_POSTGRES_USER:-factor_lab_webui}
      RESEARCH_OS_WEBUI_POSTGRES_USER: ${RESEARCH_OS_WEBUI_POSTGRES_USER:-factor_lab_webui}
      FACTOR_LAB_POSTGRES_PASSWORD_FILE: /run/webui-db-secret/password
      FACTOR_LAB_DATABASE_URL: postgresql+psycopg://${RESEARCH_OS_WEBUI_POSTGRES_USER:-factor_lab_webui}@postgres:5432/${RESEARCH_OS_POSTGRES_DB:-factor_lab}
      FACTOR_LAB_ENV_FILE: /opt/factor-lab/runtime/artifacts/settings/webui.env
      FACTOR_LAB_PRODUCTION_ROLE: webui
      FACTOR_LAB_ENVIRONMENT: production
      FACTOR_LAB_SECRETS_DIR: /opt/factor-lab/runtime/secrets-editor
    secrets:
      - source: webui_postgres_password
        target: /run/webui-db-secret/password
    depends_on:
      webui-db-bootstrap:
        condition: service_completed_successfully
    command:
      - uvicorn
      - factor_lab.webui_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8765"
    ports:
      - "127.0.0.1:${RESEARCH_OS_WEBUI_PORT:-8765}:8765"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    volumes:
      - type: bind
        source: ${RESEARCH_OS_ARTIFACT_ROOT:?set RESEARCH_OS_ARTIFACT_ROOT to the H drive artifact directory}
        target: /opt/factor-lab/runtime/artifacts
        read_only: true
      - type: bind
        source: ${RESEARCH_OS_WEBUI_SETTINGS_ROOT:?set RESEARCH_OS_WEBUI_SETTINGS_ROOT to the H drive artifacts/settings directory}
        target: /opt/factor-lab/runtime/artifacts/settings
      - type: bind
        source: ${RESEARCH_OS_SETTINGS_SECRETS_ROOT:?set RESEARCH_OS_SETTINGS_SECRETS_ROOT to the isolated H drive source/LLM secrets directory}
        target: /opt/factor-lab/runtime/secrets-editor
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  research-os-postgres:
  research-os-minio:
  research-os-dagster:

secrets:
  postgres_password:
    file: ${RESEARCH_OS_POSTGRES_PASSWORD_FILE:?set a PostgreSQL password file outside the repository}
  minio_root_user:
    file: ${RESEARCH_OS_MINIO_ROOT_USER_FILE:?set a MinIO access-key file outside the repository}
  minio_root_password:
    file: ${RESEARCH_OS_MINIO_ROOT_PASSWORD_FILE:?set a MinIO secret-key file outside the repository}
  tushare_token:
    file: ${RESEARCH_OS_TUSHARE_TOKEN_FILE:?set a Tushare token file outside the repository}
  diemeng_api_key:
    file: ${RESEARCH_OS_DIEMENG_API_KEY_FILE:?set a Diemeng API-key file outside the repository}
  webui_postgres_password:
    file: ${RESEARCH_OS_WEBUI_POSTGRES_PASSWORD_FILE:?set a dedicated WebUI PostgreSQL password file outside the repository}
