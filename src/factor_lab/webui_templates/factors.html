{% extends 'base.html' %}
{% block content %}
<section class="card">
  <h2>Factor Scoreboard</h2>
  <table>
    <thead><tr><th>Factor</th><th>Avg Score</th><th>Runs</th><th>Candidate Runs</th><th>Graveyard Runs</th></tr></thead>
    <tbody>
      {% for row in factors %}
      <tr>
        <td>{{ row.factor_name }}</td>
        <td>{{ row.avg_score }}</td>
        <td>{{ row.runs }}</td>
        <td class="good">{{ row.candidate_runs }}</td>
        <td class="bad">{{ row.graveyard_runs }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
